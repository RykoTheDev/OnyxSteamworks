[package]
name = "onyx"
version = "0.1.0"
edition = "2024"
description = "Onyx"
publish = false

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", default-features = false, features = ["image", "file"] }
globset = "0.4.20"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4"] }
walkdir = "2.5.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Faster iteration in debug builds without slowing down compile times much.
[profile.dev.package."*"]
opt-level = 2

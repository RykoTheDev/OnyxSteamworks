[package]
name = "onyx"
version = "0.1.0"
edition = "2024"
description = "Onyx"
publish = false

[dependencies]
anyhow = "1.0.104"
blake3 = "1.5.5"
clap = { version = "4.5.51", features = ["derive"] }
directories = "6.0.0"
eframe = "0.37.0"
fuzzy-matcher = "0.3.7"
flate2 = "1.0.35"
egui_extras = { version = "0.37.0", default-features = false, features = ["image", "file"] }
globset = "0.4.20"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
keyring = "3.6.3"
open = "5.3.2"
raw-window-handle = "0.6.2"
rayon = "1.10.0"
rfd = "0.17.2"
ureq = { version = "2.12.1", features = ["json"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4"] }
walkdir = "2.5.0"
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.175"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
notify-rust = "4.11"
windows-sys = { version = "0.59.0", features = ["Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_Power", "Win32_System_Time", "Win32_Graphics_Dwm", "Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Faster iteration in debug builds without slowing down compile times much.
[profile.dev.package."*"]
opt-level = 2
